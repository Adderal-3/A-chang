<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 小游戏合集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius-lg: 24px;
    --radius-md: 16px;
    --font-display: "Fredoka", "Baloo 2", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  body {
    font-family: var(--font-display);
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79, 143, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(255, 79, 143, 0.18) 0%, transparent 60%),
      linear-gradient(160deg, #0d0c33 0%, #1d1455 25%, #3e1864 50%, #6e1d6c 75%, #9c2566 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  /* 漂浮光斑 —— 增加氛围深度 */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
  }
  .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, #4F8FFF 0%, transparent 70%); top: -180px; left: -150px; opacity: 0.45; }
  .blob-2 { width: 600px; height: 600px; background: radial-gradient(circle, #FF4F8F 0%, transparent 70%); bottom: -240px; right: -200px; opacity: 0.4; animation-delay: -5s; }
  .blob-3 { width: 380px; height: 380px; background: radial-gradient(circle, #B14FFF 0%, transparent 70%); top: 45%; left: 35%; opacity: 0.32; animation-delay: -9s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -50px) scale(1.08); }
    66%      { transform: translate(-30px, 40px) scale(0.94); }
  }

  /* Hero */
  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 72px 24px 40px;
  }
  .hero-emoji {
    font-size: 60px;
    display: inline-block;
    animation: bounce 2.4s ease-in-out infinite;
    filter: drop-shadow(0 8px 24px rgba(255, 200, 100, 0.5));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-12px) rotate(5deg); }
  }
  .hero h1 {
    font-size: clamp(38px, 5.5vw, 60px);
    font-weight: 800;
    background: linear-gradient(135deg, #FFD89B 0%, #FF8FCB 50%, #C9A8FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 12px 0 10px;
    letter-spacing: 3px;
    filter: drop-shadow(0 4px 30px rgba(255, 143, 203, 0.35));
  }
  .hero p {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.65);
    font-weight: 500;
    letter-spacing: 1px;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  section { margin-bottom: 56px; }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 22px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title .badge {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
  }

  /* 最近玩过 */
  .recent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .recent-card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
  }
  .recent-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.1);
  }
  .recent-card .thumb {
    width: 48px; height: 48px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(0,0,0,0.2);
  }
  .recent-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .recent-card .meta { min-width: 0; }
  .recent-card .name { font-weight: 700; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-card .time { font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }

  /* 主游戏网格 */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  /* 横版卡片占 2 列，竖版占 1 列 */
  .game-card.is-landscape { grid-column: span 2; }
  .game-card.is-portrait  { grid-column: span 1; }

  .game-card {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease,
                border-color 0.4s ease;
    display: block;
  }
  .game-card:hover {
    transform: translateY(-10px) scale(1.015);
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      0 0 70px rgba(180, 120, 255, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }
  .game-card .img-wrap {
    display: block;
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .game-card.is-landscape .img-wrap { aspect-ratio: 16 / 9; }
  .game-card.is-portrait  .img-wrap { aspect-ratio: 3 / 4; }
  .game-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .game-card:hover img { transform: scale(1.06); }

  /* 顶部小标签 */
  .tag {
    position: absolute;
    top: 14px; left: 14px;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    z-index: 2;
    letter-spacing: 0.5px;
  }

  /* hover 时显示的「立即前往」胶囊 */
  .play-pill {
    position: absolute;
    bottom: 18px;
    right: 18px;
    background: rgba(255, 255, 255, 0.96);
    color: #1a0f3c;
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transform: translateY(8px);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 2;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .game-card:hover .play-pill {
    transform: translateY(0);
    opacity: 1;
  }

  /* 底部 */
  footer {
    text-align: center;
    padding: 32px 24px 40px;
    color: rgba(255, 255, 255, 0.45);
    font-size: 13px;
    position: relative;
    z-index: 1;
  }
  footer .heart { color: #FF8FCB; animation: heartbeat 1.5s ease-in-out infinite; display: inline-block; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  /* 响应式 */
  @media (max-width: 900px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); }
    .game-card.is-landscape { grid-column: span 2; }
    .game-card.is-portrait  { grid-column: span 1; }
  }
  @media (max-width: 600px) {
    .hero { padding: 48px 20px 28px; }
    .game-grid { grid-template-columns: 1fr; gap: 18px; }
    .game-card.is-landscape,
    .game-card.is-portrait { grid-column: span 1; }
    main { padding: 0 16px 60px; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <header class="hero">
    <div class="hero-emoji">🎮</div>
    <h1>小游戏合集</h1>
    <p>逆水寒精选小游戏 · 随时开玩</p>
  </header>

  <main>
    <section class="recent" id="recentSection" hidden>
      <h2 class="section-title">⏱ 最近玩过 <span class="badge" id="recentCount"></span></h2>
      <div class="recent-grid" id="recentGrid"></div>
    </section>

    <section class="all-games">
      <h2 class="section-title">🎯 全部游戏 <span class="badge" id="totalCount"></span></h2>
      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <footer>
    Made with <span class="heart">♥</span> · 共收录 <span id="footerCount"></span> 款小游戏
  </footer>

<script>
  // 游戏数据 —— url 之后替换成真实链接
  const games = [
    {
      id: "zaozao",
      name: "凿凿出天赏",
      tag: "活动",
      img: "./image-1778684026879.jpg",
      aspect: "landscape",
      url: "#"
    },
    {
      id: "nsti",
      name: "逆水寒NSTI 人格测试",
      tag: "测试",
      img: "./image-1778684038535.jpg",
      aspect: "portrait",
      url: "#"
    },
  ];

  const STORAGE_KEY = "gameCollection.recent.v1";

  function getRecent() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch { return []; }
  }
  function recordPlay(id) {
    const list = getRecent().filter(r => r.id !== id);
    list.unshift({ id, at: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 6)));
  }
  function formatTime(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1)  return "刚刚";
    if (min < 60) return `${min} 分钟前`;
    const h = Math.floor(min / 60);
    if (h < 24)   return `${h} 小时前`;
    const d = Math.floor(h / 24);
    return `${d} 天前`;
  }

  function renderAllGames() {
    const grid = document.getElementById("gameGrid");
    grid.innerHTML = games.map(g => `
      <a href="${g.url}" class="game-card is-${g.aspect}" data-id="${g.id}" target="_blank" rel="noopener">
        <div class="img-wrap">
          <img src="${g.img}" alt="${g.name}" loading="lazy">
        </div>
        <span class="tag">${g.tag}</span>
        <div class="play-pill">▶ 立即前往</div>
      </a>
    `).join("");

    grid.querySelectorAll(".game-card").forEach(card => {
      card.addEventListener("click", () => recordPlay(card.dataset.id));
    });
    document.getElementById("totalCount").textContent  = `${games.length} 款`;
    document.getElementById("footerCount").textContent = games.length;
  }

  function renderRecent() {
    const recent = getRecent();
    const section = document.getElementById("recentSection");
    if (recent.length === 0) { section.hidden = true; return; }
    section.hidden = false;

    const map = Object.fromEntries(games.map(g => [g.id, g]));
    const grid = document.getElementById("recentGrid");
    grid.innerHTML = recent
      .map(r => ({ ...r, game: map[r.id] }))
      .filter(r => r.game)
      .map(r => `
        <a href="${r.game.url}" class="recent-card" data-id="${r.game.id}" target="_blank" rel="noopener">
          <div class="thumb"><img src="${r.game.img}" alt="${r.game.name}"></div>
          <div class="meta">
            <div class="name">${r.game.name}</div>
            <div class="time">${formatTime(r.at)}</div>
          </div>
        </a>
      `).join("");

    grid.querySelectorAll(".recent-card").forEach(card => {
      card.addEventListener("click", () => recordPlay(card.dataset.id));
    });
    document.getElementById("recentCount").textContent = `${recent.length} 款`;
  }

  renderAllGames();
  renderRecent();
</script>
</body>
</html>
